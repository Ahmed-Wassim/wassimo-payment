services:
  payment:
    build: { context: ., dockerfile: Dockerfile.dev }
    volumes:
      - .:/app
      - payment-nodemodules:/app/node_modules
    ports: ["9053:8080"]
    env_file: [.env]
    environment:
      - PORT=8080
      - ENV=${ENV}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payment-db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      payment-db: { condition: service_healthy }
      aspire-dashboard: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [wassimo-network]

  payment-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [payment-pgdata:/var/lib/postgresql]
    ports: ["5444:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [wassimo-network]

  payment-prod:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["9063:8080"]
    env_file: [.env, .env.prod]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
    depends_on:
      payment-db: { condition: service_healthy }
      aspire-dashboard: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [wassimo-network]

  aspire-dashboard:
    image: mcr.microsoft.com/aspire/dashboard:latest
    environment:
      ASPIRE_DASHBOARD_APPLICATION_NAME: wassimo-payment
      ASPIRE_DASHBOARD_DATA_DIRECTORY: /home/app/dashboard-data
      ASPIRE_DASHBOARD_PERSISTENCE_MODE: run
    volumes:
      - payment-telemetry-data:/home/app
    ports:
      - "18888:18888"
      - "127.0.0.1:4317:18889"
    networks: [wassimo-network]

volumes:
  payment-pgdata: {}
  payment-nodemodules: {}
  payment-telemetry-data: {}

networks:
  wassimo-network:
    external: true
