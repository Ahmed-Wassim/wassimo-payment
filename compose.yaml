services:
  payment:
    build: { context: ., dockerfile: Dockerfile.dev }
    volumes:
      - .:/app
      - payment-nodemodules:/app/node_modules
    ports: ["9053:8080"]
    env_file: [.env]
    environment:
      - PORT=8080
      - ENV=${ENV}
      # ADR-009: the IN-NETWORK address wins over .env's localhost:5444
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payment-db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      payment-db: { condition: service_healthy }
    networks: [wassimo-network]

  payment-db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [payment-pgdata:/var/lib/postgresql]
    ports: ["5444:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [wassimo-network]

volumes:
  payment-pgdata: {}
  payment-nodemodules: {}

networks:
  wassimo-network:
    external: true
